<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bible in a Year</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: sticky progress header over a single reading column, grouped by era, each day a row of tappable readings */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#1d2725; --muted:#66716e; --line:#dde1dc;
  --accent:#2f6b5e; --accent-soft:#e2ede9; --gold:#a8792a; --done-ink:#ffffff;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a19; --surface:#1c2422; --ink:#e7ece9; --muted:#97a39f; --line:#2c3633;
  --accent:#6fb5a3; --accent-soft:#22332f; --gold:#d6a756; --done-ink:#0f1614; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a19; --surface:#1c2422; --ink:#e7ece9; --muted:#97a39f; --line:#2c3633;
  --accent:#6fb5a3; --accent-soft:#22332f; --gold:#d6a756; --done-ink:#0f1614; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{padding-block:18px 14px;display:grid;gap:12px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,34px);line-height:1.1;margin:0;text-wrap:balance}
.stat{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-weight:500}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:6px;font-size:13px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--done-ink)}
.btn:focus-visible,.r:focus-visible,.dn:focus-visible,.era-nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.tog{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-left:auto}
.era-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.era-nav a{flex:none;font-size:12px;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:3px 10px;white-space:nowrap}
.era-nav a.complete{color:var(--gold);border-color:var(--gold)}
main .wrap{padding-block:8px 64px}
section{padding-top:28px}
section[hidden]{display:none}
.era-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;scroll-margin-top:190px}
.era-head .stat{color:inherit;opacity:.85}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.era-head .stat{flex:none}
.era-head.complete h2::after{content:" ✓"}
.days{background:var(--surface);border:1px solid var(--line);border-radius:0 0 8px 8px;overflow:hidden}
.era-nav a::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--era);box-shadow:0 0 0 1px var(--line);vertical-align:0}
.day{border-left:4px solid var(--era)}
.day{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);scroll-margin-top:200px}
.day:first-child{border-top:0}
.day.next{background:var(--accent-soft)}
.dn{border:0;background:none;padding:4px 0;text-align:left;font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.day.done .dn{color:var(--gold)}
.reads{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.r{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:5px 10px;font-size:14px;text-align:left}
.r::before{content:"";width:12px;height:12px;border:1.5px solid var(--muted);border-radius:3px;flex:none}
.r.on{background:var(--accent);border-color:var(--accent);color:var(--done-ink)}
.r.on::before{border-color:var(--done-ink);background:var(--done-ink);clip-path:polygon(14% 52%,0 66%,38% 100%,100% 22%,86% 8%,38% 72%)}
.r:hover{border-color:var(--accent)}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px}
footer{color:var(--muted);font-size:12px;text-align:center;padding-block:0 32px}
@media (max-width:480px){.day{grid-template-columns:1fr;gap:4px}.era-head{scroll-margin-top:220px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}html{scroll-behavior:auto}}
html{scroll-behavior:smooth}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <h1>Bible in a Year</h1>
    <div class="stat"><b id="daysDone">0</b> of 365 days · <b id="pct">0%</b></div>

  <div class="bar"><i id="barFill"></i></div>
  <div class="actions">
    <button class="btn primary" id="jump" type="button">Go to next reading</button>
    <span id="resetArea"><button class="btn" id="reset" type="button">Reset</button></span>
    <label class="tog"><input type="checkbox" id="hideDone"> Hide finished eras</label>
  </div>
  <nav class="era-nav" id="eraNav" aria-label="Eras"></nav>
</div></header>

<main><div class="wrap" id="list"></div></main>
<footer class="wrap">Tap a reading to mark it read. Tap the day number to mark the whole day. Progress is saved in this browser.</footer>

const KEY = "bible-in-a-year-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { state = {}; }
let hideDone = false;
try { hideDone = localStorage.getItem(KEY + "-hide") === "1"; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const id = (d, i) => d + "-" + i;
const dayDone = day => day.slice(1).every((_, i) => state[id(day[0], i)]);
const slug = s => s.toLowerCase().replace(/[^a-z]+/g, "-") ;

const list = document.getElementById("list"), nav = document.getElementById("eraNav");
ERAS.forEach((era, ei) => {
  const sid = "era-" + ei + "-" + slug(era.n);
  era.sid = sid;
  const sec = document.createElement("section"); sec.id = sid;
  sec.innerHTML = `<div class="era-head"><h2></h2><span class="stat"></span></div><div class="days"></div>`;
  sec.querySelector("h2").textContent = era.n;
  sec.style.setProperty("--era", era.c);
  const head = sec.querySelector(".era-head");
  head.style.background = era.c;
  const [r, g, bl] = [1, 3, 5].map(i => parseInt(era.c.slice(i, i + 2), 16));
  head.style.color = (0.299 * r + 0.587 * g + 0.114 * bl) > 150 ? "#1d2725" : "#ffffff";
  const box = sec.querySelector(".days");
  era.d.forEach(day => {
    const row = document.createElement("div"); row.className = "day"; row.id = "day-" + day[0];
    const dn = document.createElement("button"); dn.type = "button"; dn.className = "dn";
    dn.textContent = "Day " + day[0]; dn.title = "Mark the whole day";
    dn.onclick = () => { const v = !dayDone(day); day.slice(1).forEach((_, i) => state[id(day[0], i)] = v); save(); render(); };
    const reads = document.createElement("div"); reads.className = "reads";
    day.slice(1).forEach((txt, i) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "r"; b.dataset.k = id(day[0], i);
      b.textContent = txt;
      b.onclick = () => { state[b.dataset.k] = !state[b.dataset.k]; if (!state[b.dataset.k]) delete state[b.dataset.k]; save(); render(); };
      reads.appendChild(b);
    });
    row.append(dn, reads); box.appendChild(row);
  });
  list.appendChild(sec);
  const a = document.createElement("a"); a.href = "#" + sid; a.textContent = era.n;
  a.style.setProperty("--era", era.c);
  a.onclick = ev => { ev.preventDefault(); document.getElementById(sid).scrollIntoView(); };
  nav.appendChild(a);
});

function nextDay() { for (const e of ERAS) for (const d of e.d) if (!dayDone(d)) return d[0]; return null; }
function render() {
  let total = 0;
  const nd = nextDay();
  ERAS.forEach((era, ei) => {
    const sec = document.getElementById(era.sid);
    let done = 0;
    era.d.forEach(day => {
      const row = document.getElementById("day-" + day[0]);
      const dd = dayDone(day); if (dd) done++;
      row.classList.toggle("done", dd); row.classList.toggle("next", day[0] === nd);
      row.querySelectorAll(".r").forEach(b => { const on = !!state[b.dataset.k]; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
    });
    total += done;
    const complete = done === era.d.length;
    sec.querySelector(".era-head").classList.toggle("complete", complete);
    sec.querySelector(".era-head .stat").textContent = done + " / " + era.d.length;
    sec.hidden = hideDone && complete;
    nav.children[ei].classList.toggle("complete", complete);
  });
  document.getElementById("daysDone").textContent = total;
  const p = Math.round(total / 365 * 100);
  document.getElementById("pct").textContent = p + "%";
  document.getElementById("barFill").style.width = (total / 365 * 100) + "%";
  document.getElementById("jump").textContent = nd ? "Go to Day " + nd : "Plan complete";
}
document.getElementById("jump").onclick = () => { const n = nextDay(); if (n) document.getElementById("day-" + n).scrollIntoView({ block: "center" }); };
const hd = document.getElementById("hideDone"); hd.checked = hideDone;
hd.onchange = () => { hideDone = hd.checked; try { localStorage.setItem(KEY + "-hide", hideDone ? "1" : "0"); } catch (e) {} render(); };
const ra = document.getElementById("resetArea");
function showReset() {
  ra.innerHTML = '<button class="btn" id="reset" type="button">Reset</button>';
  document.getElementById("reset").onclick = () => {
    ra.innerHTML = '<span class="confirm">Clear all progress? <button class="btn" id="yes" type="button">Clear</button><button class="btn" id="no" type="button">Cancel</button></span>';
    document.getElementById("yes").onclick = () => { state = {}; save(); render(); showReset(); };
    document.getElementById("no").onclick = showReset;
  };
}
showReset();
render();
</script>
